ration Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="middle">0</text><path d="M192.0 442L192.0 448" stroke="#89917f" stroke-width="1" fill="none"/><text x="192.0" y="469" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="middle">5</text><path d="M258.0 442L258.0 448" stroke="#89917f" stroke-width="1" fill="none"/><text x="258.0" y="469" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="middle">10</text><path d="M324.0 442L324.0 448" stroke="#89917f" stroke-width="1" fill="none"/><text x="324.0" y="469" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="middle">15</text><path d="M390.0 442L390.0 448" stroke="#89917f" stroke-width="1" fill="none"/><text x="390.0" y="469" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="middle">20</text><text x="22" y="517" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#252720" text-anchor="start">O intervalo em três anos inclui zero.</text><text x="22" y="552" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Intervenção menos cuidado usual.</text><text x="22" y="587" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">16 clínicas; 20.250 na linha de base.</text><text x="22" y="628" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Rastreamento não é incidência</text><text x="22" y="654" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">de câncer nem mortalidade.</text><text x="22" y="701" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#535a4d" text-anchor="start">Gráfico editorial • JAMA • 21.10.2026</text></svg>