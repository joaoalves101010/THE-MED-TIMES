<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>Distribuir não é tratar</title><rect width="1200" height="500" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#20241f">Distribuir não é tratar</text><rect x="24.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="38.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Infusão</text><text x="38.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Reservatório e cânula</text><rect x="408.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="422.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Ultrassom</text><text x="422.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Distribuição local</text><rect x="792.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="806.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Teste</text><text x="806.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Contraste em camundongos</text><text x="24" y="258" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Não demonstrou redução do tumor, maior sobrevida ou benefício clínico em pessoas.</text></svg>