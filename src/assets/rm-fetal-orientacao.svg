<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">RM fetal: acompanhar a orientação, não dar o diagnóstico</title><desc id="desc">Esquema geométrico não anatômico: o movimento altera a orientação, a arquitetura E(3)-Pose incorpora simetria e busca ajudar a ajustar a aquisição dos cortes. Não são imagens de ressonância nem comparação de desempenho.</desc><rect width="1200" height="420" fill="#f4f0e5"/><text x="30" y="37" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="30" y="79" font-size="29" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">RM fetal: acompanhar a orientação, não dar o diagnóstico</text><path d="M30 98H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="170" y="138" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="middle">Movimento</text><g transform="translate(170 225) rotate(-22)"><ellipse rx="62" ry="67" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -67V67" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-20 -43 Q-58 -14 -24 16 Q-52 40 -14 46 M20 -43 Q58 -14 24 16 Q52 40 14 46" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="170" y="328" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="middle">A orientação pode mudar</text><text x="600" y="138" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="middle">Simetria</text><g transform="translate(600 225) rotate(0)"><ellipse rx="62" ry="67" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -67V67" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-20 -43 Q-58 -14 -24 16 Q-52 40 -14 46 M20 -43 Q58 -14 24 16 Q52 40 14 46" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="600" y="328" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="middle">Uma propriedade do modelo</text><text x="1030" y="138" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="middle">Aquisição</text><g transform="translate(1030 225) rotate(0)"><ellipse rx="62" ry="67" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -67V67" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-20 -43 Q-58 -14 -24 16 Q-52 40 -14 46 M20 -43 Q58 -14 24 16 Q52 40 14 46" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="1030" y="328" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="middle">Ajustar a orientação dos cortes</text><path d="M286 222H462" fill="none" stroke="#282923" stroke-width="2"/><path d="M454 217L462 222L454 227" fill="none" stroke="#282923" stroke-width="2"/><path d="M724 222H898" fill="none" stroke="#282923" stroke-width="2"/><path d="M890 217L898 222L890 227" fill="none" stroke="#282923" stroke-width="2"/><path d="M946 192H1114" fill="none" stroke="#72745a" stroke-width="2"/><path d="M946 214H1114" fill="none" stroke="#72745a" stroke-width="2"/><path d="M946 236H1114" fill="none" stroke="#72745a" stroke-width="2"/><path d="M946 258H1114" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="357" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">E(3)-Pose · representação geométrica, não anatômica · desenvolvimento, não diagnóstico validado</text><path d="M30 374H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="402" font-size="14" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial • baseado na fonte citada</text></svg>