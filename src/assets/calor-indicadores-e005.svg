<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img"><title>Quatro domínios para monitorar calor e saúde materno-infantil</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58644f"/></marker></defs><rect width="1200" height="470" fill="#faf8f0"/><text x="28" y="40" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#252720" text-anchor="start">CALOR EXTREMO: O QUE CONECTAR</text><text x="28" y="72" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">Quatro domínios de indicadores no marco da OMS</text><rect x="28" y="100" width="440" height="53" fill="#eeeee5" stroke="#a7ad9d"/><text x="45" y="134" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#252720" text-anchor="start">Saúde materna e infantil</text><rect x="28" y="167" width="440" height="53" fill="#eeeee5" stroke="#a7ad9d"/><text x="45" y="201" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#252720" text-anchor="start">Vigilância em saúde pública</text><rect x="28" y="234" width="440" height="53" fill="#eeeee5" stroke="#a7ad9d"/><text x="45" y="268" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#252720" text-anchor="start">Monitoramento clima–saúde</text><rect x="28" y="301" width="440" height="53" fill="#eeeee5" stroke="#a7ad9d"/><text x="45" y="335" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#252720" text-anchor="start">Medidas de exposição ao calor</text><path d="M480 218L567 218" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="583" y="116" width="240" height="211" fill="#e4e8da" stroke="#a7ad9d"/><text x="703" y="164" font-family="Liberation Sans,Arial,sans-serif