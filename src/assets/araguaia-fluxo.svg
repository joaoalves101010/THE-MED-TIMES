<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Cateterismo: o caminho de acesso no Araguaia</title><desc id="desc">Fluxo esquemático: encaminhamento, Regulação Estadual e atendimento no Hospital Santa Mônica, em Redenção. A fonte relata um paciente de São Félix do Xingu atendido na região. Não é um mapa.</desc><rect width="1200" height="420" fill="#f4f0e5"/><text x="30" y="37" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="30" y="79" font-size="29" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Cateterismo: o caminho de acesso no Araguaia</text><path d="M30 98H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="141" font-size="16" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">01</text><text x="30" y="188" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Encaminhamento</text><text x="30" y="218" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Acesso pelo SUS</text><path d="M30 239H350" fill="none" stroke="#72745a" stroke-width="2"/><text x="430" y="141" font-size="16" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">02</text><text x="430" y="188" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Regulação Estadual</text><text x="430" y="218" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Organização do acesso</text><path d="M430 239H750" fill="none" stroke="#72745a" stroke-width="2"/><text x="830" y="141" font-size="16" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">03</text><text x="830" y="188" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Redenção</text><text x="830" y="218" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Hospital Santa Mônica</text><path d="M830 239H1150" fill="none" stroke="#72745a" stroke-width="2"/><path d="M347 180H402" fill="none" stroke="#282923" stroke-width="2"/><path d="M394 175L402 180L394 185" fill="none" stroke="#282923" stroke-width="2"/><path d="M747 180H802" fill="none" stroke="#282923" stroke-width="2"/><path d="M794 175L802 180L794 185" fill="none" stroke="#282923" stroke-width="2"/><text x="30" y="287" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">NO RELATO DA SESPA</text><text x="30" y="320" font-size="21" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Paciente de São Félix do Xingu atendido na própria região do Araguaia.</text><text x="30" y="349" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Implantação do serviço ≠ avaliação de resultados de acesso ou segurança.</text><path d="M30 374H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="402" font-size="14" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial • baseado na fonte citada</text></svg>