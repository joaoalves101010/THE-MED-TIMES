<svg xmlns="http://www.w3.org/2000/svg" width="420" height="810" viewBox="0 0 420 810" role="img" aria-labelledby="title desc"><title id="title">RM fetal: acompanhar a orientação, não dar o diagnóstico</title><desc id="desc">Esquema geométrico não anatômico: o movimento altera a orientação, a arquitetura E(3)-Pose incorpora simetria e busca ajudar a ajustar a aquisição dos cortes. Não são imagens de ressonância nem comparação de desempenho.</desc><rect width="420" height="810" fill="#f4f0e5"/><text x="22" y="32" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="22" y="77" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">RM fetal: acompanhar</text><text x="22" y="106" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">a orientação, não dar</text><text x="22" y="135" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">o diagnóstico</text><path d="M22 156H398" fill="none" stroke="#72745a" stroke-width="2"/><g transform="translate(83 225) rotate(-22)"><ellipse rx="43" ry="49" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -49V49" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-15 -33 Q-40 -10 -18 12 Q-36 28 -10 33 M15 -33 Q40 -10 18 12 Q36 28 10 33" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="157" y="202" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Movimento</text><text x="157" y="233" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">A orientação</text><text x="157" y="259" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">pode mudar</text><path d="M83 287v29m-5 -6l5 6 5 -6" fill="none" stroke="#282923" stroke-width="2"/><g transform="translate(83 395) rotate(0)"><ellipse rx="43" ry="49" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -49V49" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-15 -33 Q-40 -10 -18 12 Q-36 28 -10 33 M15 -33 Q40 -10 18 12 Q36 28 10 33" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="157" y="372" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Simetria</text><text x="157" y="403" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Uma propriedade</text><text x="157" y="429" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">do modelo</text><path d="M83 457v29m-5 -6l5 6 5 -6" fill="none" stroke="#282923" stroke-width="2"/><g transform="translate(83 565) rotate(0)"><ellipse rx="43" ry="49" fill="none" stroke="#282923" stroke-width="2"/><path d="M0 -49V49" stroke="#72745a" stroke-width="2" stroke-dasharray="5 5"/><path d="M-15 -33 Q-40 -10 -18 12 Q-36 28 -10 33 M15 -33 Q40 -10 18 12 Q36 28 10 33" fill="none" stroke="#72745a" stroke-width="2"/></g><text x="157" y="542" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Aquisição</text><text x="157" y="573" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Ajustar a orientação</text><text x="157" y="599" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">dos cortes</text><path d="M30 545H136" fill="none" stroke="#72745a" stroke-width="2"/><path d="M30 565H136" fill="none" stroke="#72745a" stroke-width="2"/><path d="M30 585H136" fill="none" stroke="#72745a" stroke-width="2"/><path d="M22 634H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="665" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">E(3)-Pose · esquema não anatômico.</text><text x="22" y="691" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Desenvolvimento tecnológico,</text><text x="22" y="717" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">não diagnóstico validado.</text><path d="M22 742H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="769" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial</text><text x="22" y="792" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Baseado na fonte citada</text></svg>