<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>Do atlas humano à hipótese experimental</title><rect width="1200" height="500" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#20241f">Do atlas humano à hipótese experimental</text><rect x="24.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="38.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">21 pessoas</text><text x="38.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Amostras de gordura visceral</text><rect x="408.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="422.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">86 mil núcleos</text><text x="422.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Atlas celular do tecido</text><rect x="792.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="806.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Modelos</text><text x="806.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Células, tecido e camundongos</text><text x="24" y="258" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Amostra humana pequena; benefício e segurança de tratamento em pessoas não demonstrados.</text></svg>