<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="title desc"><title id="title">Um sinal inicial não é uma conclusão clínica</title><desc id="desc">Entre 27 participantes agrupados nas duas doses biologicamente ótimas, 16 não tiveram progressão. Em outro desfecho, quatro tiveram redução superior a 30% nas lesões-alvo. A amostra é pequena e não houve comparação randomizada; os resultados não comprovam cura nem ganho de sobrevida.</desc><rect width="420" height="760" fill="#f4f0e5"/><text x="22" y="32" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="22" y="77" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Um sinal inicial não é</text><text x="22" y="106" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">uma conclusão clínica</text><path d="M22 127H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="161" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">START-001 · FASE 1/2</text><text x="22" y="219" font-size="48" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">27</text><text x="101" y="179" font-size="16" fill="#282923" font-family="Arial, sans-serif">participantes em duas</text><text x="101" y="199" font-size="16" fill="#282923" font-family="Arial, sans-serif">doses biologicamente</text><text x="101" y="219" font-size="16" fill="#282923" font-family="Arial, sans-serif">ótimas (dados agrupados)</text><circle cx="32" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="62" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="92" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="122" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="152" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="182" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="212" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="242" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="272" cy="250" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="32" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="62" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="92" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="122" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="152" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="182" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="212" cy="279" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="242" cy="279" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="272" cy="279" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="32" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="62" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="92" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="122" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="152" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="182" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="212" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="242" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="272" cy="308" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><text x="22" y="348" font-size="22" font-weight="bold" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">16 sem progressão</text><path d="M22 372H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="421" font-size="44" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">4</text><text x="70" y="399" font-size="21" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">com redução &gt;30%</text><text x="70" y="425" font-size="21" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">nas lesões-alvo</text><text x="22" y="466" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Desfecho distinto, na mesma amostra.</text><text x="22" y="492" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Contagens não devem ser somadas.</text><path d="M22 516H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="545" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">O QUE O ENSAIO NÃO PROVA</text><text x="22" y="584" font-size="23" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Cura ou ganho de sobrevida</text><text x="22" y="621" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Amostra pequena;</text><text x="22" y="647" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">sem comparação randomizada.</text><path d="M22 692H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="719" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial</text><text x="22" y="742" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Baseado na fonte citada</text></svg>