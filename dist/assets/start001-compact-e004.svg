<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">START-001: contagens nas duas doses biologicamente ótimas</title><desc id="desc">27 participantes agrupados nas duas doses biologicamente ótimas. 16 sem progressão; quatro com redução superior a 30% nas lesões-alvo. Desfechos distintos, não somáveis. Sem comparação randomizada. Esquema editorial baseado na fonte citada.</desc><rect width="360" height="320" fill="#f4f0e5"/><g fill="#282923" font-family="Arial, sans-serif"><text x="18" y="27" font-size="13" font-weight="bold" fill="#72745a">START-001 · FASE 1/2</text><g font-family="Georgia, serif" font-size="36"><text x="18" y="79">27</text><text x="18" y="139">16</text><text x="18" y="199">4</text></g><g font-size="16"><text x="85" y="53" font-size="16">Participantes em duas</text><text x="85" y="70" font-size="16">doses biologicamente</text><text x="85" y="87" font-size="16">ótimas (dados agrupados)</text><text x="85" y="129">Sem progressão</text><text x="85" y="182">Redução &gt;30%</text><text x="85" y="203">nas lesões-alvo</text><text x="18" y="245">Desfechos distintos, não somáveis.</text><text x="18" y="269">Sem comparação randomizada.</text></g><text x="18" y="302" font-size="13" fill="#72745a">Esquema editorial · fonte citada na legenda</text></g><g stroke="#72745a" stroke-width="1" fill="none"><path d="M18 40H342M18 98H342M18 158H342M18 222H342M18 285H342"/></g></svg>
