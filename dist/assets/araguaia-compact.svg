<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">O acesso ao cateterismo no Araguaia</title><desc id="desc">Encaminhamento, Regulação Estadual e atendimento no Hospital Santa Mônica em Redenção. O relato descreve um paciente de São Félix do Xingu atendido na região. Esquema editorial, não mapa.</desc><rect width="360" height="360" fill="#f4f0e5"/><g fill="#282923" font-family="Arial,sans-serif"><text x="18" y="27" font-size="13" font-weight="bold" fill="#72745a">ARAGUAIA · ACESSO PELO SUS</text><g font-size="21" font-family="Georgia,serif"><text x="45" y="73">Encaminhamento</text><text x="45" y="144">Regulação Estadual</text><text x="45" y="215">Redenção</text></g><g font-size="16"><text x="45" y="240">Hospital Santa Mônica</text><text x="18" y="285">Relato: paciente de São Félix</text><text x="18" y="308">do Xingu atendido na região.</text></g><text x="18" y="344" font-size="13" fill="#72745a">Esquema editorial · não é um mapa</text></g><g stroke="#72745a" fill="none" stroke-width="1"><path d="M18 40H342M18 257H342M18 325H342"/></g><g stroke="#282923" stroke-width="2" fill="none"><path d="M53 87v28m-5 -6l5 6 5 -6M53 158v28m-5 -6l5 6 5 -6"/></g></svg>
