<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Um sinal inicial não é uma conclusão clínica</title><desc id="desc">Entre 27 participantes agrupados nas duas doses biologicamente ótimas, 16 não tiveram progressão. Em outro desfecho, quatro tiveram redução superior a 30% nas lesões-alvo. A amostra é pequena e não houve comparação randomizada; os resultados não comprovam cura nem ganho de sobrevida.</desc><rect width="1200" height="420" fill="#f4f0e5"/><text x="30" y="37" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="30" y="79" font-size="29" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Um sinal inicial não é uma conclusão clínica</text><path d="M30 98H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="139" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">START-001 · FASE 1/2</text><text x="30" y="188" font-size="50" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">27</text><text x="109" y="164" font-size="16" fill="#282923" font-family="Arial, sans-serif">participantes em duas</text><text x="109" y="184" font-size="16" fill="#282923" font-family="Arial, sans-serif">doses biologicamente</text><text x="109" y="204" font-size="16" fill="#282923" font-family="Arial, sans-serif">ótimas (dados agrupados)</text><circle cx="46" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="75" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="104" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="133" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="162" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="191" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="220" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="249" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="278" cy="234" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="46" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="75" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="104" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="133" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="162" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="191" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="220" cy="264" r="8" fill="#72745a" stroke="#72745a" stroke-width="1.5"/><circle cx="249" cy="264" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="278" cy="264" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="46" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="75" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="104" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="133" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="162" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="191" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="220" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="249" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><circle cx="278" cy="294" r="8" fill="#f4f0e5" stroke="#72745a" stroke-width="1.5"/><text x="30" y="338" font-size="20" font-weight="bold" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">16 sem progressão</text><text x="370" y="173" font-size="47" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">4</text><text x="420" y="152" font-size="22" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">com redução &gt;30%</text><text x="420" y="181" font-size="22" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">nas lesões-alvo</text><text x="370" y="220" font-size="17" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Desfecho distinto, na mesma amostra.</text><text x="370" y="247" font-size="17" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Contagens não devem ser somadas.</text><path d="M760 130L760 346" fill="none" stroke="#72745a" stroke-width="2"/><text x="800" y="145" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">O QUE O ENSAIO NÃO PROVA</text><text x="800" y="187" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Cura</text><text x="800" y="226" font-size="25" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Ganho de sobrevida</text><text x="800" y="273" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Amostra pequena; sem</text><text x="800" y="299" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">comparação randomizada.</text><path d="M30 374H1170" fill="none" stroke="#72745a" stroke-width="2"/><text x="30" y="402" font-size="14" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial • baseado na fonte citada</text></svg>