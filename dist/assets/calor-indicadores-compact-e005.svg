<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Calor e saúde: quatro fontes de informação</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58644f"/></marker></defs><rect width="360" height="360" fill="#faf8f0"/><text x="20" y="30" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#252720" text-anchor="start">CALOR &amp; SAÚDE</text><text x="20" y="57" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#252720" text-anchor="start">Informação que precisa se conectar</text><rect x="20" y="76" width="320" height="34" fill="#eeeee5" stroke="#a7ad9d"/><text x="32" y="99" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#252720" text-anchor="start">Saúde materna e infantil</text><rect x="20" y="119" width="320" height="34" fill="#eeeee5" stroke="#a7ad9d"/><text x="32" y="142" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#252720" text-anchor="start">Vigilância em saúde pública</text><rect x="20" y="162" width="320" height="34" fill="#eeeee5" stroke="#a7ad9d"/><text x="32" y="185" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#252720" text-anchor="start">Clima e saúde</text><rect x="20" y="205" width="320" height="34" fill="#eeeee5" stroke="#a7ad9d"/><text x="32" y="228" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#252720" text-anchor="start">Exposição ao calor</text><path d="M180 253L180 279" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="305" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#252720" text-anchor="middle">Analisar → investigar → responder</text><text x="20" y="340" font-family="Liberation Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#535a4d" text-anchor="start">Esquema, não demonstração causal.</text></svg>