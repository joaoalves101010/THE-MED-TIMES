<svg xmlns="http://www.w3.org/2000/svg" width="360" height="544" viewBox="0 0 360 544" role="img"><title>Distribuir não é tratar</title><rect width="360" height="544" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20241f">Distribuir não é tratar</text><rect x="24" y="114" width="312" height="100" fill="#f4f2ef"/><text x="38" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Infusão</text><text x="38" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Reservatório e cânula</text><rect x="24" y="227" width="312" height="100" fill="#f4f2ef"/><text x="38" y="254" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Ultrassom</text><text x="38" y="279" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Distribuição local</text><rect x="24" y="340" width="312" height="100" fill="#f4f2ef"/><text x="38" y="367" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Teste</text><text x="38" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Contraste em camundongos</text><text x="24" y="467" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Não demonstrou redução do tumor, maior</text><text x="24" y="486" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">sobrevida ou benefício clínico em</text><text x="24" y="505" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">pessoas.</text></svg>