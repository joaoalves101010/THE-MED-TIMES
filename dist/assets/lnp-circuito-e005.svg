<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><title>Circuito experimental de produção automatizada de nanopartículas lipídicas</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58644f"/></marker></defs><rect width="1200" height="450" fill="#faf8f0"/><text x="28" y="38" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#252720" text-anchor="start">NANOPARTÍCULAS: FECHAR O CIRCUITO DE FABRICAÇÃO</text><text x="28" y="69" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">Automação descrita em 25.09.2026; processo em duas etapas estudado anteriormente.</text><rect x="28" y="112" width="262" height="160" fill="#eeeee5" stroke="#a7ad9d"/><text x="45" y="145" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#6c302c" text-anchor="start">1</text><text x="45" y="184" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#252720" text-anchor="start">Mistura</text><text x="45" y="225" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">RNA + lipídios</text><path d="M297 193L317 193" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="324" y="112" width="262" height="160" fill="#eeeee5" stroke="#a7ad9d"/><text x="341" y="145" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#6c302c" text-anchor="start">2</text><text x="341" y="184" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#252720" text-anchor="start">Intervalo</text><text x="341" y="225" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">Tempo controlado</text><path d="M593 193L613 193" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="112" width="262" height="160" fill="#eeeee5" stroke="#a7ad9d"/><text x="637" y="145" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#6c302c" text-anchor="start">3</text><text x="637" y="184" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#252720" text-anchor="start">Tampão</text><text x="637" y="225" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">Interrompe crescimento</text><path d="M889 193L909 193" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="916" y="112" width="262" height="160" fill="#eeeee5" stroke="#a7ad9d"/><text x="933" y="145" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#6c302c" text-anchor="start">4</text><text x="933" y="184" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#252720" text-anchor="start">Medição</text><text x="933" y="225" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#252720" text-anchor="start">Tamanho das partículas</text><path d="M1050 282V332H450V284" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="750" y="320" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#252720" text-anchor="middle">AJUSTE DOS PARÂMETROS</text><text x="28" y="382" font-family="Liberation Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#252720" text-anchor="start">A medição de forma permanece fora do sistema automatizado.</text><text x="28" y="420" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#535a4d" text-anchor="start">Esquema editorial sem escala • plataforma experimental de fabricação, não ensaio de tratamento.</text></svg>