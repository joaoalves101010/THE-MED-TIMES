<svg xmlns="http://www.w3.org/2000/svg" width="420" height="760" viewBox="0 0 420 760" role="img" aria-labelledby="title desc"><title id="title">Cateterismo: o acesso no Araguaia</title><desc id="desc">Fluxo esquemático: encaminhamento, Regulação Estadual e atendimento no Hospital Santa Mônica, em Redenção. A fonte relata um paciente de São Félix do Xingu atendido na região. Não é um mapa.</desc><rect width="420" height="760" fill="#f4f0e5"/><text x="22" y="32" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">CADERNO VISUAL</text><text x="22" y="77" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Cateterismo: o acesso</text><text x="22" y="106" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">no Araguaia</text><path d="M22 127H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="165" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">01</text><text x="63" y="165" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Encaminhamento</text><text x="63" y="195" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Acesso pelo SUS</text><path d="M63 213v29m-5 -6l5 6 5 -6" fill="none" stroke="#282923" stroke-width="2"/><text x="22" y="285" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">02</text><text x="63" y="285" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Regulação Estadual</text><text x="63" y="315" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Organização do acesso</text><path d="M63 333v29m-5 -6l5 6 5 -6" fill="none" stroke="#282923" stroke-width="2"/><text x="22" y="405" font-size="14" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">03</text><text x="63" y="405" font-size="24" font-weight="normal" fill="#282923" font-family="Georgia, serif" text-anchor="start">Redenção</text><text x="63" y="435" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Hospital Santa Mônica</text><path d="M22 466H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="496" font-size="13" font-weight="bold" fill="#72745a" font-family="Arial, sans-serif" text-anchor="start">NO RELATO DA SESPA</text><text x="22" y="527" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">Paciente de São Félix do Xingu</text><text x="22" y="553" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">atendido na própria região</text><text x="22" y="579" font-size="18" font-weight="normal" fill="#282923" font-family="Arial, sans-serif" text-anchor="start">do Araguaia.</text><text x="22" y="625" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Implantação não é avaliação</text><text x="22" y="651" font-size="16" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">de acesso ou segurança.</text><path d="M22 692H398" fill="none" stroke="#72745a" stroke-width="2"/><text x="22" y="719" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Esquema editorial</text><text x="22" y="742" font-size="15" font-weight="normal" fill="#77776e" font-family="Arial, sans-serif" text-anchor="start">Baseado na fonte citada</text></svg>