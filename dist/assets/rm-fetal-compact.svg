<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">RM fetal: orientação e simetria</title><desc id="desc">Esquema geométrico não anatômico. Movimento altera orientação. E(3)-Pose incorpora simetria e busca ajudar a ajustar a aquisição dos cortes. Não é diagnóstico validado.</desc><rect width="360" height="320" fill="#f4f0e5"/><g font-family="Arial,sans-serif" fill="#282923"><text x="18" y="27" font-size="13" font-weight="bold" fill="#72745a">RM FETAL · E(3)-POSE</text><g font-size="16"><text x="105" y="69">Movimento muda</text><text x="105" y="91">a orientação</text><text x="105" y="141">O modelo incorpora</text><text x="105" y="163">a simetria</text><text x="105" y="213">Busca ajudar a ajustar</text><text x="105" y="235">a aquisição dos cortes</text><text x="18" y="277">Não é diagnóstico validado.</text></g><text x="18" y="304" font-size="13" fill="#72745a">Esquema editorial · não anatômico</text></g><g fill="none" stroke="#72745a" stroke-width="1"><path d="M18 40H342M18 255H342"/></g><g fill="none" stroke="#282923" stroke-width="1.5"><g transform="translate(54 78) rotate(-25)"><ellipse rx="23" ry="26"/><path d="M0 -26V26" stroke="#72745a" stroke-dasharray="3 3"/></g><g transform="translate(54 150)"><ellipse rx="23" ry="26"/><path d="M0 -26V26" stroke="#72745a" stroke-dasharray="3 3"/></g><g transform="translate(54 222)"><ellipse rx="23" ry="26"/><path d="M-30 -13H30M-30 0H30M-30 13H30" stroke="#72745a"/></g><path d="M54 108v11m-4 -4l4 4 4 -4M54 180v11m-4 -4l4 4 4 -4"/></g></svg>
