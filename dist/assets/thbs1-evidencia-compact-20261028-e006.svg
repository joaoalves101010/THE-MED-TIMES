<svg xmlns="http://www.w3.org/2000/svg" width="360" height="573" viewBox="0 0 360 573" role="img"><title>Do atlas humano à hipótese experimental</title><rect width="360" height="573" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20241f">Do atlas humano à hipótese</text><text x="24" y="99" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20241f">experimental</text><rect x="24" y="143" width="312" height="100" fill="#f4f2ef"/><text x="38" y="170" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">21 pessoas</text><text x="38" y="195" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Amostras de gordura visceral</text><rect x="24" y="256" width="312" height="100" fill="#f4f2ef"/><text x="38" y="283" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">86 mil núcleos</text><text x="38" y="308" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Atlas celular do tecido</text><rect x="24" y="369" width="312" height="100" fill="#f4f2ef"/><text x="38" y="396" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">Modelos</text><text x="38" y="421" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Células, tecido e</text><text x="38" y="441" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">camundongos</text><text x="24" y="496" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Amostra humana pequena; benefício e</text><text x="24" y="515" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">segurança de tratamento em pessoas não</text><text x="24" y="534" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">demonstrados.</text></svg>