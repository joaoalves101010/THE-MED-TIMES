<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img"><title>Queensland: planejar a próxima janela</title><rect width="420" height="680" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20241f">Queensland: planejar a</text><text x="24" y="99" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#20241f">próxima janela</text><rect x="24" y="143" width="372" height="100" fill="#f4f2ef"/><text x="38" y="170" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">30 nov. 2026</text><text x="38" y="195" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Início das candidaturas</text><rect x="24" y="256" width="372" height="100" fill="#f4f2ef"/><text x="38" y="283" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">14 dez. 2026</text><text x="38" y="308" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Fim da janela</text><rect x="24" y="369" width="372" height="100" fill="#f4f2ef"/><text x="38" y="396" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">8 mar.–30 abr.</text><text x="38" y="421" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Período de estágios em 2027</text><text x="24" y="496" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Elegibilidade e adequação à graduação</text><text x="24" y="515" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">devem ser conferidas. Não é garantia</text><text x="24" y="534" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">de colocação.</text></svg>