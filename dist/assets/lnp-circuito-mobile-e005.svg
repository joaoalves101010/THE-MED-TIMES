<svg xmlns="http://www.w3.org/2000/svg" width="420" height="744" viewBox="0 0 420 744" role="img"><title>Etapas da produção automatizada de nanopartículas lipídicas</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58644f"/></marker></defs><rect width="420" height="744" fill="#faf8f0"/><text x="22" y="35" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#252720" text-anchor="start">NANOPARTÍCULAS</text><text x="22" y="64" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Produção com controle de tamanho</text><rect x="22" y="91" width="333" height="91" fill="#eeeee5" stroke="#a7ad9d"/><text x="36" y="122" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#252720" text-anchor="start">1 · Mistura</text><text x="36" y="155" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">RNA + lipídios</text><path d="M187 190L187 207" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="22" y="212" width="333" height="91" fill="#eeeee5" stroke="#a7ad9d"/><text x="36" y="243" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#252720" text-anchor="start">2 · Intervalo</text><text x="36" y="276" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Tempo controlado</text><path d="M187 311L187 328" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="22" y="333" width="333" height="91" fill="#eeeee5" stroke="#a7ad9d"/><text x="36" y="364" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#252720" text-anchor="start">3 · Tampão</text><text x="36" y="397" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Interrompe crescimento</text><path d="M187 432L187 449" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="22" y="454" width="333" height="91" fill="#eeeee5" stroke="#a7ad9d"/><text x="36" y="485" font-family="Liberation Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#252720" text-anchor="start">4 · Medição</text><text x="36" y="518" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Tamanho das partículas</text><path d="M366 500H389V227H367" stroke="#58644f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="22" y="611" font-family="Liberation Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#252720" text-anchor="start">Medição → ajuste de parâmetros</text><text x="22" y="651" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#252720" text-anchor="start">Forma: medição externa ao circuito.</text><text x="22" y="689" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#535a4d" text-anchor="start">Esquema editorial. Não ensaio clínico.</text><text x="22" y="720" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#535a4d" text-anchor="start">Fonte: MIT • 25.09.2026 • Sem escala.</text></svg>