<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><title>Queensland: planejar a próxima janela</title><rect width="1200" height="500" fill="#fff"/><text x="24" y="35" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#541919">THE MED TIMES · ESQUEMA EDITORIAL</text><text x="24" y="70" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#20241f">Queensland: planejar a próxima janela</text><rect x="24.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="38.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">30 nov. 2026</text><text x="38.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Início das candidaturas</text><rect x="408.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="422.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">14 dez. 2026</text><text x="422.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Fim da janela</text><rect x="792.0" y="114" width="366.0" height="100" fill="#f4f2ef"/><text x="806.0" y="141" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#541919">8 mar.–30 abr.</text><text x="806.0" y="166" font-family="Arial,sans-serif" font-size="17" font-weight="normal" fill="#20241f">Período de estágios em 2027</text><text x="24" y="258" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#555">Elegibilidade e adequação à graduação devem ser conferidas. Não é garantia de colocação.</text></svg>